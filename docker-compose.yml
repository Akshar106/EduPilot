# The EduPilot stack.
#
#   docker compose up -d db                     # just Postgres, for `uv run uvicorn ...`
#   docker compose up -d --build                # the app at http://localhost:8088
#   docker compose --profile metrics up -d      # plus Prometheus :9095 and Grafana :3001
#   LLM_SIMULATED=true docker compose up -d     # simulated models, for load tests
#
#   browser ──► nginx :8088 ──► api (2 replicas, stateless) ──► Postgres + pgvector
#                                     │                       └► Redis (limits, turn leases)
#                         worker ◄────┘ ingestion jobs (Postgres queue)
#
# Every API replica is interchangeable: conversations, checkpoints, the index
# and its live version are in Postgres; rate limits and the global turn limit
# are in Redis. Scale with API_REPLICAS=4 (or `--scale api=4`).
#
# Host ports avoid the usual ones (5432, 6379, 8000, 9090, 3000) so the stack
# runs next to whatever else is already listening.

x-app: &app
  build: .
  image: edupilot:local
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql://edupilot:edupilot@db:5432/${EDUPILOT_DB_NAME:-edupilot}
    REDIS_URL: redis://redis:6379/0
    EDUPILOT_ENV: ${EDUPILOT_ENV:-development}
    INGEST_WORKER: external
    # nginx sets X-Forwarded-For; trust it, so anonymous callers are limited
    # per client rather than all sharing the proxy's address.
    TRUST_PROXY_HEADERS: "true"
    # Turns in flight across all replicas: what the model provider's rate
    # limit can sustain. Per replica, MAX_CONCURRENT_TURNS still applies.
    # The defaults suit the local reranker (docs/load-testing.md); with hosted
    # models the CPU is idle and both can be several times higher.
    GLOBAL_MAX_TURNS: ${GLOBAL_MAX_TURNS:-4}
    MAX_CONCURRENT_TURNS: ${MAX_CONCURRENT_TURNS:-2}
    LLM_SIMULATED: ${LLM_SIMULATED:-false}
    # Cross-encoder calls run one at a time per process; give each replica its
    # share of the cores (cores / API_REPLICAS) so two replicas reranking at
    # once do not oversubscribe the CPU. See retrieval/inference.py.
    INFERENCE_CONCURRENCY: ${INFERENCE_CONCURRENCY:-1}
    INFERENCE_THREADS: ${INFERENCE_THREADS:-0}
    CORS_ALLOWED_ORIGINS: http://localhost:8088
    # From .env or the shell; required in production.
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  # The course corpus: read for rebuilds and for opening a cited PDF.
  volumes:
    - ./data:/data

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: edupilot
      POSTGRES_PASSWORD: edupilot
      POSTGRES_DB: edupilot
    ports:
      - "${EDUPILOT_DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # HNSW builds use maintenance_work_mem; the 64 MB default spills to disk
    # on a rebuild and makes it several times slower.
    command: ["postgres", "-c", "maintenance_work_mem=512MB", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupilot -d edupilot"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${EDUPILOT_REDIS_PORT:-6380}:6379"
    # Rate-limit buckets and turn leases are short-lived by design; there is
    # nothing worth persisting, so no snapshots or append-only file.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    <<: *app
    environment:
      <<: *app-env
      PORT: "8000"
    deploy:
      replicas: ${API_REPLICAS:-2}

  worker:
    <<: *app
    entrypoint: ["edupilot-worker"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9100"
    # No HTTP API here; healthy means its metrics endpoint answers.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "${EDUPILOT_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["metrics"]
    ports:
      - "9095:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["metrics"]
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-edupilot}
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning:ro

volumes:
  pgdata:
