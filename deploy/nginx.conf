# Load balancer in front of the API replicas (docker-compose.yml).
#
# `api` resolves to every replica; nginx spreads requests across them. The
# replicas share no memory, so any one can serve any request.

upstream edupilot_api {
    server api:8000;
    # Reused connections to the replicas, so a burst does not open a new TCP
    # connection per request.
    keepalive 32;
}

server {
    listen 80;
    client_max_body_size 30m;

    location / {
        proxy_pass http://edupilot_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chat answers stream as server-sent events: pass each token through
        # as it arrives instead of buffering the response, and allow a long
        # turn to finish.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
